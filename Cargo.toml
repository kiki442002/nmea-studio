[package]
name = "nmea-studio"
version = "0.1.0"
edition = "2024"
description = "NMEA 0183 & NMEA 2000 Simulator, Analyzer, and Studio (inspired by NemaStudio)"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serialport = "4.7"
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"
